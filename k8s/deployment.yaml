apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-web
  template:
    metadata:
      labels:
        app: nginx-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          envFrom:
            - configMapRef:
                name: webapp-config
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "<html><head><title>Welcome</title></head><body><h1>${WELCOME_MSG}</h1></body></html>" > /usr/share/nginx/html/index.html;
              nginx -g 'daemon off;'
          ports:
            - containerPort: 80
